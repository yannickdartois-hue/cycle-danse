<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Danse">
<meta name="theme-color" content="#a21caf">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cycle danse · outils</title>
<link rel="stylesheet" href="eps-design.css">
<link rel="stylesheet" href="eps-outil.css">
<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#1c2128;--fg:#1c2128;--muted:#5b6470;--line:#dde2e8;--chip:#eef1f5;--accent:#a21caf;--accent-soft:#f6e8f8;--accent-fg:#fff;--warn:#c2410c;--ok:#15803d;--pD:#0e7490}
:root[data-theme="dark"]{--bg:#0d1117;--surface:#161b22;--ink:#e6edf3;--fg:#e6edf3;--muted:#8b949e;--line:#2a313b;--chip:#21262d;--accent:#e08fea;--accent-soft:#3a1d3f;--accent-fg:#0d1117;--warn:#fb923c;--ok:#4ade80;--pD:#67c6dd}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson","Segoe UI",Roboto,Arial,sans-serif}
header.top{max-width:1100px;margin:0 auto;padding:14px 16px 0}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header.top h1{margin:0;font:800 22px/1.15 "Archivo","Arial Narrow",Arial,sans-serif;display:flex;align-items:center}
header.top p{margin:6px 0 0;color:var(--muted);font-size:max(14px,var(--fs-min,15px))}
.appicon{width:40px;height:40px;border-radius:9px;margin:0 10px 0 0;box-shadow:0 1px 3px rgba(0,0,0,.25);flex:none}
.cbtn{display:inline-flex;align-items:center;min-height:44px;border:1.5px solid var(--line);background:var(--surface);color:var(--accent);border-radius:10px;padding:6px 14px;font-weight:700;text-decoration:none;font-size:15px}
nav#nav{max-width:1100px;margin:12px auto 0;padding:0 16px 12px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}
nav#nav button{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 12px;font:600 15px "Atkinson",Arial,sans-serif;min-height:44px;cursor:pointer}
nav#nav button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
@media (max-width:700px){nav#nav{flex-wrap:nowrap;overflow-x:auto}nav#nav button{flex:none}}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font:800 clamp(26px,3.6vw,34px)/1.08 "Archivo","Arial Narrow",Arial,sans-serif;margin:8px 0 10px;text-wrap:balance}
h3{font:800 21px/1.15 "Archivo","Arial Narrow",Arial,sans-serif;margin:22px 0 8px}
h4{margin:0}
a{color:var(--accent)}
.small{font-size:max(14px,var(--fs-min,15px))}.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-fg);padding:8px 14px;border-radius:10px;font:700 15px "Atkinson",Arial,sans-serif;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn.mini{min-height:36px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pill{display:inline-block;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:max(13px,var(--fs-min,15px));margin:0 4px 4px 0}
.st-faite{background:#dcfce7;color:#14532d}.st-jour{background:#fef3c7;color:#78350f}.st-eval{background:#fee2e2;color:#7f1d1d}
.sgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media (max-width:760px){.sgrid{grid-template-columns:repeat(4,1fr)}}
.sbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px;min-height:56px;text-align:left;cursor:pointer;font:inherit;min-width:0}
.sbtn b{display:block;font:800 22px/1 "Archivo",Arial,sans-serif}
.sbtn small{display:block;font-size:max(13px,var(--fs-min,15px));color:var(--muted);line-height:1.2;hyphens:auto}
.sbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}.sbtn.on small{color:var(--accent-fg);opacity:.85}
.sbtn.st-faite b::after{content:" ✓";color:var(--ok)}.sbtn.st-jour b::after{content:" ●";color:var(--warn)}
.seance{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px}
.obj{font-size:17px}
.tl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.tlb{min-width:104px;border:0;border-radius:10px;padding:8px 12px;color:#fff;font:inherit;font-size:max(14px,var(--fs-min,15px));line-height:1.25;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.tlb b{order:-1;font:800 26px/1 "Archivo",Arial,sans-serif}
.t-acc,.t-inst{background:#64748b}.t-ech{background:#0e7490}.t-ex{background:#a21caf}.t-sf{background:#c2410c}.t-bil{background:#334155}
.prep{background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:10px 0}
.prep ul{margin:6px 0 0;padding-left:20px}
.note{background:var(--chip);border-radius:10px;padding:8px 12px}
.fiche{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;overflow:hidden}
.fiche header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fiche header h4{flex:1;min-width:200px;font:800 22px/1.12 "Archivo",Arial,sans-serif}
.tag{font-size:max(13px,var(--fs-min,15px));text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:700}
.dur{font-weight:700;color:var(--warn)}
.fiche p{margin:6px 0}.fiche ol{margin:4px 0;padding-left:22px}.fiche li{margin:2px 0}
.roles{border-left:4px solid var(--pD);padding-left:10px}
.ok{border-left:4px solid var(--ok);padding-left:10px}
.var{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:max(14.5px,var(--fs-min,15px))}.var p{background:var(--chip);border-radius:8px;padding:6px 10px;margin:4px 0}
@media screen and (max-width:600px){.var{grid-template-columns:1fr}}
.sch{float:right;width:46%;max-width:420px;margin:0 0 8px 14px}
.sch-wide{margin-top:8px;clear:both}
@media screen and (max-width:760px){.sch{float:none;width:100%;margin:6px 0}}
svg{max-width:100%;height:auto}
.tab{width:100%;border-collapse:collapse;font-size:max(14.5px,var(--fs-min,15px));margin:8px 0;background:var(--surface)}
.tab th,.tab td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tab th{background:var(--chip)}
@media screen and (max-width:760px){.tab.scroll{display:block;overflow-x:auto;max-width:100%}}
.hero{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;padding:16px;margin:8px 0 14px}
.hero h2{margin-top:0}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column}
.acard h3{margin:6px 0 4px;font-size:19px}.acard p{margin:4px 0}.acard .actions{margin-top:auto;padding-top:6px}
.acard-h{display:flex;justify-content:space-between;align-items:center}.anum{font:800 28px "Archivo",Arial,sans-serif;color:var(--accent)}
.dlist{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lv{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:14px;padding:12px}
.lv h3{margin:0 0 4px;color:var(--c)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 12px;break-inside:avoid}
.pcard .kino{margin:6px 0 2px;background:#fff;border-radius:10px;padding:4px}.pcard .kino svg{display:block;width:100%;height:auto}
.pcard h4{font:800 19px "Archivo",Arial,sans-serif;display:flex;justify-content:space-between;gap:8px}
.pcard dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:max(14.5px,var(--fs-min,15px))}
.pcard dt{color:var(--muted);font-weight:700}.pcard dd{margin:0}
.pcard .secu{color:#991b1b;font-size:max(14px,var(--fs-min,15px));margin:6px 0 0}
:root[data-theme="dark"] .pcard .secu{color:#fca5a5}
.fd2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fd2>div{min-width:0}.fd h4{font:800 17px "Archivo",Arial,sans-serif;margin:6px 0}.fd ul{margin:2px 0 6px;padding-left:20px}.fd li{font-size:max(15px,var(--fs-min,15px))}
.fdimg{display:block;width:100%;max-width:640px;margin:8px auto;border-radius:8px;border:1px solid var(--line)}
@media screen and (max-width:700px){.fd2{grid-template-columns:1fr}}
.proc{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 12px;margin:10px 0;break-inside:avoid}
.proc h4{font:800 20px "Archivo",Arial,sans-serif;margin-bottom:4px}
.proc .dz{margin-top:8px;padding:4px}
.tir-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.tir-big div{background:var(--accent);color:#fff;border-radius:14px;padding:14px}
.tir-big small{display:block;font-size:15px;opacity:.9;text-transform:uppercase;letter-spacing:.04em}
.tir-big b{display:block;font:800 clamp(24px,4vw,36px)/1.1 "Archivo",Arial,sans-serif;margin-top:4px}
.tir-big i{display:block;font-style:normal;margin-top:4px;font-size:15px}
.tirtab td{min-width:120px}
.tirtab td.vide{color:var(--muted)}
.tirtab .rel{border:0;background:none;color:var(--accent);font-size:18px;cursor:pointer;padding:0 4px}
.tirtab .rel:disabled{color:var(--muted);opacity:.4;cursor:default}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:8px 0}
.form label{display:flex;flex-direction:column;gap:3px;font-size:max(14px,var(--fs-min,15px))}
input,select,textarea{font:inherit;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px}
textarea{width:100%;min-height:90px}
.nt td,.nt th{text-align:center}.nt td:first-child,.nt th:first-child{text-align:left}
.nt select{min-height:36px;padding:2px 4px}
.nt .tot{font:800 18px "Archivo",Arial,sans-serif}
.checks{columns:2}
@media (max-width:520px){.checks{columns:1}}
.pg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.lines{line-height:2.2}
.timer{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.timer[hidden]{display:none!important}
.timer b{font:800 30px "Archivo",Arial,sans-serif;font-variant-numeric:tabular-nums}
.timer button{min-height:40px}
.warnbox{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d;border-radius:12px;padding:10px 14px}
:root[data-theme="dark"] .warnbox{background:#3a1515;border-color:#7f1d1d;color:#fecaca}
#printzone{display:none}
body.printmode #printzone{display:block;padding:0 8px}
body.gym .seance h2{font-size:clamp(34px,5vw,44px)}
body.gym .obj{font-size:19px}
body.gym .fiche h4{font-size:30px}
body.gym .fiche p,body.gym .fiche li{font-size:19px}
body.gym .tlb b{font-size:34px}
@media print{
  @page{size:A4;margin:11mm}
  body{background:#fff;color:#000;font-size:10pt}
  :root{--surface:#fff;--ink:#000;--muted:#444;--line:#999;--chip:#f0f0f0;--accent-soft:#f7ecf8}
  header.top,nav,main,.noprint,.timer{display:none!important}
  #printzone{display:block!important}
  .seance{border:0;padding:0;margin:0;break-before:page}
  .seance:first-child{break-before:auto}
  .fiche{break-inside:auto;border-color:#999;padding:8px 10px}
  .fiche header{break-after:avoid}
  .fiche header h4{font-size:15pt}
  .fiche p,.fiche li{font-size:10pt}
  .sch{width:44%;max-width:none}
  svg,figure,.var,.ok,tr,.dz-pc,.proc,.pcard,.lv{break-inside:avoid}
  .tlb,.t-acc,.t-inst,.t-ech,.t-ex,.t-sf,.t-bil,.tir-big div{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tlb{min-width:80px;padding:4px 8px}.tlb b{font-size:16pt}
  .pg{border:0;padding:0;break-after:page}
  .pg:last-child{break-after:auto}
  h2,h3,h4{break-after:avoid}
  a{color:#000;text-decoration:none}
  .pcards,.lvgrid{display:block}.pcard,.lv{margin:0 0 6px}
  .pcard .kino{max-width:300px;float:right;margin:0 0 4px 10px}.pcard{overflow:hidden}
  .tab{font-size:9pt}
}
</style>

  --accent:#a21caf;--accent-soft:#f4e4f5;--accent-fg:#ffffff;--sport:#a21caf}

<body>
<header class="top"><div class="toprow"><h1><img class="appicon" src="icon-192.png" alt="" width="40" height="40">Cycle danse · CA3 · Seconde</h1><a class="cbtn" href="./">‹ Écran de cours</a></div>
<p>Des porters et des figures dynamiques aux procédés de composition · 8 séances de 75 min · groupes de 3 à 5 · tatamis</p></header>
<nav id="nav" aria-label="Onglets"></nav>
<main id="main"></main>
<div id="printzone"></div>
<div class="timer noprint" id="timer" hidden><span id="tm-lab"></span><b id="tm-t">00:00</b><button class="btn mini ghost" id="tm-close" type="button">Arrêter</button></div>
<script src="danse-donnees.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const PDF = id => `pdf/2de-danse-${id}.pdf`;

/* ---------- Fiches et séances ---------- */
function ficheHTML(f, n){
  const wide = /^(porters|proc|frise|focales)/.test(f.schema || "");
  const sch = f.schema ? `<div class="${wide ? "sch-wide" : "sch"}">${schema(f.schema)}</div>` : "";
  const v = (f.moins || f.plus) ? `<div class="var">${f.moins ? `<p><b>−</b> ${esc(f.moins)}</p>` : ""}${f.plus ? `<p><b>+</b> ${esc(f.plus)}</p>` : ""}</div>` : "";
  return `<article class="fiche">
  <header><span class="tag">${esc(f.cat)}</span><h4>${n ? n + ". " : ""}${esc(f.titre)}</h4><span class="dur">${f.duree} min</span></header>
  ${wide ? "" : sch}
  <p><b>Dispositif.</b> ${esc(f.dispo)}</p>
  <p class="roles"><b>Rôle de chacun.</b> ${esc(f.roles)}</p>
  <p><b>Déroulement.</b></p><ol>${f.deroul.map(d => `<li>${esc(d)}</li>`).join("")}</ol>
  <p><b>Consignes et critères de réalisation.</b> ${esc(f.crit)}</p>
  <p class="ok"><b>Critère de réussite.</b> ${esc(f.reussite)}</p>
  ${v}${wide ? sch : ""}
  </article>`;
}
function statut(i){
  const today = LS.get("danse2de_jour", -1);
  if(i >= 6 && today !== i) return ["eval", "Évaluation"];
  if(today < 0) return ["avenir", "À venir"];
  if(i < today) return ["faite", "Faite"];
  if(i === today) return ["jour", "Aujourd’hui"];
  return ["avenir", "À venir"];
}
const PASS_TXT = {ensemble:"Passage : plusieurs groupes ensemble", jumeles:"Passage : groupes jumelés", classe:"Passage : seul devant la classe"};
function seanceHTML(i, forPrint){
  const S = SEANCES[i], st = statut(i);
  const frise = `<div class="tl">` + S.tl.map(b => `<button type="button" class="tlb t-${b[2]}" style="flex:${b[1]}" data-min="${b[1]}" data-lab="${esc(b[0])}" title="Minuteur de ${b[1]} min"><span>${esc(b[0])}</span><b>${b[1]}′</b></button>`).join("") + `</div>`;
  const tot = S.tl.reduce((a, b) => a + b[1], 0);
  let h = `<section class="seance" id="sea-${S.id}">
  <div><span class="pill st-${st[0]}">${st[1]}</span><span class="pill">${PASS_TXT[S.passage]}</span>${S.tirage ? `<span class="pill">Tirage au sort ${S.tirage}</span>` : ""}${S.porters.length ? `<span class="pill">Porters : ${S.porters.join(", ")}</span>` : ""}</div>
  <h2>${S.id} · ${esc(S.titre)}</h2>
  <p class="obj"><b>Objectif.</b> ${esc(S.obj)}</p>
  ${frise}<p class="small muted">${tot} min de pratique.</p>
  <div class="prep"><b>Ce que la séance prépare pour l’évaluation</b><ul>${S.prepare.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`;
  if(S.install) h += `<p class="note"><b>Installation et sécurité.</b> ${esc(S.install)}</p>`;
  S.fiches.forEach((f, k) => h += ficheHTML(f, k + 1));
  if(S.videos && S.videos.length) h += `<p class="note"><b>Vidéos de la séance.</b> ${S.videos.map(v => `<a href="${esc(v[1])}" target="_blank" rel="noopener">${esc(v[0])}</a>`).join(" · ")}</p>`;
  if(S.bilan) h += `<p class="note"><b>À retenir au bilan.</b> ${esc(S.bilan)}</p>`;
  if(!forPrint) h += `<div class="actions noprint"><button class="btn" type="button" data-today="${i}">Marquer comme séance du jour</button><button class="btn ghost" type="button" data-print="${S.id}">Imprimer cette séance</button><a class="btn ghost" href="${PDF(S.id)}">PDF</a>${S.tirage ? `<button class="btn ghost" type="button" data-tab="tirage">Ouvrir le tirage</button>` : ""}</div>`;
  return h + `</section>`;
}

/* ---------- Vues ---------- */
const VIEWS = {};
let curSeance = Math.max(0, LS.get("danse2de_jour", 0));
VIEWS.accueil = () => {
  const cards = SEANCES.map((S, i) => { const st = statut(i); const ex = S.fiches.filter(f => !/^(Échauffement|Bilan)/.test(f.cat)).map(f => esc(f.titre));
    return `<article class="acard"><div class="acard-h"><span class="anum">${S.id}</span><span class="pill st-${st[0]}">${st[1]}</span></div>
    <h3>${esc(S.titre)}</h3><p>${esc(S.obj)}</p><p class="small muted">${PASS_TXT[S.passage]}${S.tirage ? " · tirage au sort" : ""}</p><p class="small muted">Au programme : ${ex.join(" · ")}</p>
    <div class="actions"><button class="btn" type="button" data-open-s="${i}">Voir la séance</button><a class="btn ghost" href="${PDF(S.id)}">PDF</a></div></article>`; }).join("");
  return `<section class="hero"><h2>Cycle danse · CA3 · Seconde</h2>

function tirSave(s){ LS.set(TK, s); }
const ETAPES = [["theme","Thème","S4"],["procede","Procédé imposé","S4"],["levier","Focale dominante","S4"],["espace","Contrainte d’espace","S5"],["porter","Porter imposé","S5"],["temps","Contrainte de temps","S6"]];
const listeDe = k => k === "theme" ? THEMES.map(t => t.t) : CONTRAINTES[k].l;
function tirer(cl, g, k){
  const L = listeDe(k), pris = Object.values(cl).map(x => x && x[k]).filter(v => v != null);
  let libres = L.map((_, i) => i).filter(i => !pris.includes(i) && !(cl[g] && cl[g][k] === i));
  if(!libres.length) libres = L.map((_, i) => i).filter(i => !(cl[g] && cl[g][k] === i));
  cl[g] = cl[g] || {}; cl[g][k] = libres[Math.floor(Math.random() * libres.length)];
}
let dernier = null;
function valeur(k, i){ if(i == null) return ""; return k === "theme" ? THEMES[i].t : CONTRAINTES[k].l[i]; }

  ${big}

function notState(){ const s = LS.get(NK, null); return s && s.classes ? s : {cur:"Classe 1", classes:{"Classe 1":{eleves:[], grp:{}, el:{}}}}; }
function notSave(s){ LS.set(NK, s); }
const COMP = EVAL.afl1.filter(e => e.qui === "groupe"), INTERP = EVAL.afl1.filter(e => e.qui === "élève");
const VALS = e => e.rep.map(r => parseFloat((r.match(/(\d+(?:,\d+)?)\s*$/) || [0, "0"])[1].replace(",", ".")));
function optDeg(e, v, attr){ const vs = [...new Set([].concat(...e.rep.map(r => (r.match(/(\d+(?:,\d+)?)/g) || []).map(x => parseFloat(x.replace(",", "."))))))].filter(x => x <= e.pts).sort((a, b) => a - b);
  return `<select ${attr}><option value="">—</option>${vs.map(x => `<option value="${x}" ${+v === x && v !== "" && v != null ? "selected" : ""}>${String(x).replace(".", ",")}</option>`).join("")}</select>`; }
function optAfl(a, v, attr){ return `<select ${attr}><option value="">—</option>${a.deg.map(d => `<option value="${d[1]}" ${v !== "" && v != null && +v === d[1] ? "selected" : ""}>${esc(d[0])} ${String(d[1]).replace(".", ",")}</option>`).join("")}</select>`; }
function noteEleve(c, e){
  const g = c.grp[e.g] || {}, x = c.el[e.nom] || {};
  const comp = COMP.reduce((a, k, i) => a + (+g["c" + i] || 0), 0);
  const p = n => INTERP.reduce((a, k, i) => a + (+x[n + i] || 0), 0);
  const interp = Math.max(p("a"), p("b"));
  const tot = comp + interp + (+x.afl2 || 0) + (+x.afl3 || 0);
  return {comp, interp, tot};
}
VIEWS.notation = () => {

    ${c.eleves.map((e, k) => { const x = c.el[e.nom] || {}, n = noteEleve(c, e); return `<tr><td>${esc(e.nom)}</td><td><select data-eg="${k}">${["", ...Array.from({length:10}, (_, i) => "G" + (i + 1))].map(g => `<option ${g === e.g ? "selected" : ""}>${g}</option>`).join("")}</select></td>${INTERP.map((q, i) => `<td>${optDeg(q, x["a" + i], `data-ne="${k}|a${i}"`)}</td>`).join("")}${INTERP.map((q, i) => `<td>${optDeg(q, x["b" + i], `data-ne="${k}|b${i}"`)}</td>`).join("")}<td>${optAfl(EVAL.afl2, x.afl2, `data-ne="${k}|afl2"`)}</td><td>${optAfl(EVAL.afl3, x.afl3, `data-ne="${k}|afl3"`)}</td><td class="tot">${String(Math.round(n.tot * 4) / 4).replace(".", ",")}</td></tr>`; }).join("")}</table>` : "";
  return `<h2>Saisie des notes</h2><p>Les noms et les notes restent sur cet appareil (rien n’est envoyé en ligne). Importer la liste de la classe depuis Pronote (export .csv ou liste collée), répartir les élèves en groupes, puis saisir les degrés. L’export CSV est prêt pour Pronote.</p>
  <div class="form noprint"><label>Classe <select id="nt-cl">${Object.keys(s.classes).map(k => `<option ${k === s.cur ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></label><button class="btn ghost mini" type="button" id="nt-add">Nouvelle classe</button>
  <label>Fichier Pronote (.csv, .txt) <input type="file" id="nt-file" accept=".csv,.txt,text/csv,text/plain"></label></div>
  <details class="noprint"><summary>Coller une liste (un élève par ligne)</summary><textarea id="nt-paste" placeholder="NOM Prénom"></textarea><button class="btn mini" type="button" id="nt-pasteok">Ajouter ces élèves</button></details>
  ${c.eleves.length ? "" : `<p class="note">Aucun élève pour cette classe.</p>`}
  ${gtab}${etab}
  <div class="actions noprint"><button class="btn" type="button" id="nt-csv" ${c.eleves.length ? "" : "disabled"}>Exporter en CSV</button><button class="btn ghost" type="button" id="nt-raz">Effacer cette classe</button></div>`;
};
function importNoms(txt){
  const lignes = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const sep = lignes.length && /;/.test(lignes[0]) ? ";" : (/\t/.test(lignes[0] || "") ? "\t" : (/,/.test(lignes[0] || "") ? "," : null));
  let noms = lignes.map(l => { if(!sep) return l; const c = l.split(sep).map(x => x.replace(/^"|"$/g, "").trim()); return c.length > 1 && c[1] && !/\d/.test(c[1]) && c[0].toUpperCase() === c[0] ? c[0] + " " + c[1] : c[0]; });
  noms = noms.filter(n => n && !/^(nom|élève|eleve)\b/i.test(n));
  const s = notState(), c = s.classes[s.cur];
  noms.forEach(n => { if(!c.eleves.some(e => e.nom === n)) c.eleves.push({nom:n, g:""}); });
  notSave(s); render();
}
function exportCSV(){
  const s = notState(), c = s.classes[s.cur];
  const L = [["Élève","Groupe","Composer /6","Interpréter /6","AFL2 /4","AFL3 /4","Note /20"].join(";")];
  c.eleves.forEach(e => { const x = c.el[e.nom] || {}, n = noteEleve(c, e); L.push([e.nom, e.g, n.comp, n.interp, x.afl2 || "", x.afl3 || "", Math.round(n.tot * 4) / 4].map(v => String(v).replace(".", ",")).join(";")); });
  const b = new Blob(["﻿" + L.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `danse-2de-${s.cur.replace(/\W+/g, "-")}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

let TM = null;
function beep(f, d){ try{ const A = new (window.AudioContext || window.webkitAudioContext)(), o = A.createOscillator(); o.frequency.value = f; o.connect(A.destination); o.start(); setTimeout(() => { o.stop(); A.close(); }, d); }catch(e){} }
function startTimer(min, lab){ stopTimer(); const fin = Date.now() + min * 60000; $("#timer").hidden = false; $("#tm-lab").textContent = lab;

  }
  if(kind === "porters") return `<section>${VIEWS.porters()}</section>`;
  if(kind === "procedes") return `<section>${VIEWS.procedes()}</section>`;
  if(kind === "figdyn") return `<section>${figdynHTML(true)}</section>`;
  if(kind === "projet") return `<div class="pg"><h2>Fiche projet du groupe</h2><p class="small">Thème : ………………… · Procédé imposé : ………………… · Focale : ………………… · Espace : ………………… · Porter : ………………… · Temps : …………………</p>${projetCorps()}</div>`;
  if(kind === "spectateur") return [1, 2].map(() => `<div class="pg"><h2>Fiche du spectateur-lecteur</h2><p class="small">Mon nom : ……………………… · Séance : ……</p>${specHTML()}</div>`).join("");
  if(kind === "echauffement") return `<div class="pg"><h2>Échauffement autonome de groupe</h2>${echHTML()}</div>`;
  if(kind === "securite") return `<div class="pg"><h2>Sécurité des porters</h2>${secuHTML()}</div>`;
  if(kind === "evaluation") return `<div class="pg"><h2>Évaluation danse CA3 · Seconde · /20</h2>${evalHTML()}</div>`;
  if(kind === "banque") return `<section>${VIEWS.banque()}</section>`;
  if(kind === "tirages"){ const s = tirState(), cl = s.classes[s.cur] || {}; return Array.from({length: s.nb}, (_, i) => contratHTML("G" + (i + 1), cl["G" + (i + 1)], s.cur)).join(""); }
  return "";
}
function doPrint(kind){
  $("#printzone").innerHTML = printContent(kind);
  document.body.classList.add("printing");
  setTimeout(() => { window.print(); document.body.classList.remove("printing"); $("#printzone").innerHTML = ""; }, 60);
}

/* ---------- Démarrage ---------- */
(function(){
  const q = new URLSearchParams(location.search).get("print");
  if(q){ document.body.classList.add("printmode"); $("#printzone").innerHTML = printContent(q); return; }
  render();
})();
if("serviceWorker" in navigator && location.protocol === "https:"){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script>
