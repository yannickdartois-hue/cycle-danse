<title>Cycle danse</title>
<!-- Page FABRIQUÉE par mon-eps/atelier/ecran-de-cours/construire.py : ne pas la modifier à la main ici.
     Moteur commun : ecran.js et ecran.css. Propre à l'activité : le <style> et le <script> ci-dessous. -->
<link rel="stylesheet" href="ecran.css">
<style>
/* ===== Propre au cycle danse : couleurs, niveaux, schémas ===== */
:root{--sol:#ECEFEE; --craie:#FFFFFF; --encre:#172033; --repere:#5A6475; --trait:#D5DBDD;
  --ligne:#A21CAF; --ligne-fonce:#64116C; --ligne-pale:#F4E4F5;
  --vert:#1D6B3A; --vert-pale:#E6F3EA; --alerte:#B42318; --alerte-pale:#FDE8E6;
  --facile:#2F6FB0; --facile-pale:#EAF2FB; --dur:#B4441C; --dur-pale:#FCEDE6;
  --d:"Archivo","Arial Narrow",Arial,sans-serif; --t:"Atkinson","Segoe UI",Roboto,Arial,sans-serif;
  --sur-encre:#FFFFFF; --fait:#9AA3AE;
  --c-s:#A21CAF; --c-s-pale:#F4E4F5; --sur-niv:#FFFFFF;}
:root[data-theme="dark"]{
  --sol:#11161D; --craie:#1B222C; --encre:#E9EEF3; --repere:#9AA5B3; --trait:#323C49; --sur-encre:#11161D; --fait:#5B6573;
  --ligne:#D58EDD; --ligne-fonce:#E9BDEE; --ligne-pale:#311B35;
  --vert:#6FD39F; --vert-pale:#15301F; --alerte:#FF8A80; --alerte-pale:#3A1A18;
  --facile:#7FB0E8; --facile-pale:#162638; --dur:#F29470; --dur-pale:#3A2018;
  --c-s:#D58EDD; --c-s-pale:#311B35; --sur-niv:#11161D; color-scheme:dark}
.schema{background:#EEF1F0;border-radius:14px;padding:8px;color:#172033}
.c-gym{fill:#EEF1F0}
.c-gymline{stroke:#C9D0D3;stroke-width:2;fill:none}
.c-floor{fill:#FFFFFF}
.c-line{stroke:#F2A900;stroke-width:5;fill:none}
.c-att{stroke:#F2A900;stroke-width:3;fill:none}
.c-net{stroke:#172033;stroke-width:6}
.c-zone{fill:#F2A900;fill-opacity:.22;stroke:#8A5A00;stroke-width:1.5;stroke-dasharray:6 4}
.c-zonet{fill:#8A5A00;font:700 max(13px,var(--fs-min,15px)) var(--t)}
.c-target{fill:#F2A900;fill-opacity:.3;stroke:#8A5A00;stroke-width:1.5}
.c-cone{fill:#E8590C}
.c-pa{fill:#2F6FB0}
.c-pb{fill:#C2410C}
.c-pn{fill:#5A6475}
.c-pt{fill:#fff;font:800 16px var(--d);text-anchor:middle;dominant-baseline:central}
.c-ball{stroke:#172033;stroke-width:2.5;stroke-dasharray:8 5;fill:none}
.c-run{stroke:#172033;stroke-width:3;fill:none}
.c-head-b,.c-head-r{fill:#172033}
.c-label{fill:#172033;font:700 max(13px,var(--fs-min,15px)) var(--t);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.c-say{fill:#172033;font:italic 700 max(13px,var(--fs-min,15px)) var(--t);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.c-shadow{fill:#172033;fill-opacity:.07}
.c-ordre circle{fill:#F2A900;stroke:#fff;stroke-width:2}
.c-ordre text{fill:#172033;font:800 15px var(--d);text-anchor:middle;dominant-baseline:central}
.legende{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 4px 0;font-size:max(14px,var(--fs-min,15px));color:var(--repere)}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i{display:inline-block;flex:none}
.legende .rond{width:14px;height:14px;border-radius:50%}
.legende .pt{width:24px;border-top:2.5px dashed currentColor}
.legende .tr{width:24px;border-top:3px solid currentColor}
.legende .num{width:18px;height:18px;border-radius:50%;background:#F2A900;color:#172033;font:800 max(12px,var(--fs-min,15px))/18px var(--d);text-align:center;font-style:normal}
.defi{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--ligne-pale);font-size:17px}
.defi b{color:var(--ligne-fonce)}

/* Danse : schémas (styles injectés par danse-donnees.js), pastille du mode de passage */
.passage{display:inline-grid;place-items:center;font:700 max(14px,var(--fs-min,15px)) var(--t);padding:4px 10px;border-radius:999px;background:var(--ligne-pale);color:var(--ligne-fonce)}
.dz{margin-top:4px}
</style>
<style>/* Lisibilité terrain : textes à 15 px minimum à l'écran ; tailles d'origine à l'impression. */@media print{:root{--fs-min:0px}}</style>
<link rel="stylesheet" href="eps-charte-v1.css">
<style>/* Charte v1 : couleur de l'activité et teinte de chaque cycle (calculées par construire.py) */
:root{--act:#a21caf;--act-fonce:#64116c;--act-pale:#f4e4f5;--act-sombre:#cc82d3;--act-pale-sombre:#351b41}
:root{--c-s:#a21caf;--c-s-pale:#f4e4f5}
body.niv-s{--niv:#a21caf;--sur-niv:#ffffff;--niv-pale:var(--act-pale)}
:root[data-theme="dark"] body.niv-s{--niv:#b955c3;--sur-niv:#0d1117}
.cy button[data-cy=s].on{background:#a21caf;color:#ffffff}
:root[data-theme="dark"] .cy button[data-cy=s].on{background:#b955c3;color:#0d1117}
.pc.niv-s .sc.jour{outline-color:var(--ligne)}
.pc.niv-s{--nivp:#a21caf}
</style>
</head>
<body>
<header class="barre">
  <img src="icon-192.png" alt="">
  <div class="app">Danse<small>Lycée Pompidou</small></div>
  <span class="pastille-niv" id="cyPast">2de</span>
  <div class="titre" id="titre"></div>
  <a class="bt clair" id="prep" href="outils.html">Préparer</a>
  <button class="bt clair baide" type="button" onclick="EPSAide.ouvrir()" aria-label="Mode d’emploi" title="Mode d’emploi">?</button>
</header>
<div class="trace"></div>
<div class="niveau" id="niveau"></div>
<section class="deroule" id="deroule" aria-label="Déroulé de la séance"></section>
<main class="zone" id="zone"></main>
<footer class="pouce">
  <button class="bt bord" id="btSeances" type="button">‹ Séances</button>
  <button class="bt bord" id="btOutils" type="button">Outils</button>
  <button class="bt bord" id="btAjuster" type="button">Ajuster le déroulé</button>
  <div class="info" id="info"></div>
</footer>
<div id="couche"></div>

<script src="danse-donnees.js"></script>
<script>
'use strict';
/* Écran de cours — danse : ce qui est propre à l'activité.
   Source : mon-eps/atelier/ecran-de-cours/apps/. Le moteur commun est ecran.js. */
/* Le cycle de danse tient en un niveau (Seconde). Chaque séance garde son déroulé (tl) et ses fiches. */
const courtD=t=>String(t||'').split(/\s:\s|\s·\s/)[0];
const convD=f=>({t:f.titre,k:f.cat,disp:f.dispo,four:f.roles,deroul:f.deroul||[],cons:f.crit?[f.crit]:[],reus:f.reussite,moins:f.moins,plus:f.plus,spec:f.schema});
const PASSAGE_TXT={ensemble:'Plusieurs groupes ensemble',jumeles:'Groupes jumelés',classe:'Seul devant la classe'};
const DANSE=SEANCES.map(S=>({id:S.id.toLowerCase(),n:S.id,title:S.titre,short:courtD(S.titre),obj:S.obj,passage:S.passage,tirage:S.tirage,porters:S.porters||[],
  prepare:S.prepare||[],install:S.install,bilan:S.bilan,
  tl:S.tl.map(t=>[t[0],String(t[1]),t[2]]),ex:S.fiches.map(convD),evalPage:false,status:/^Évaluation/.test(S.titre)?'eval':''}));
const APP={
  old:'outils.html',
  cle:'da',
  niv:{s:{label:'Seconde',court:'2de',long:'SECONDE',L:DANSE}},
  defaut:'s',
  lienOld:()=>APP.old,
  lireCur(){const j=lire('danse2de_jour',-1);return {s:j>=0&&DANSE[j]?DANSE[j].id:''}},
  marquerJour(c,id){const j=DANSE.findIndex(s=>s.id===id);if(j<0)return;ecrire('danse2de_jour',j);CUR.s=id},
  outils:[{"titre":"Pendant le cours","items":[["tirage","Tirage au sort","thème et contraintes"],["porters","Porters","répertoire, sécurité"],["figdyn","Figures dynamiques","code A à D, critères"],["procedes","Procédés","frises et définitions"],["passages","Passages","organiser le public"]]},
          {"titre":"Adapter","items":[["leviers","Focales","émotion, rire, spectaculaire, danger"],["banque","Banque","situations de rechange"],["diff","Différenciation","peur, aisance, dispense"],["echauff","Échauffements","guidé et autonome"],["securite","Sécurité","règles, prises, rôles"]]},
          {"titre":"Évaluer","items":[["eval","Évaluation","grille /20"],["notation","Notes","saisie et export CSV"],["sources","Repères et sources","pour préparer"]]}],
  urlOutil:id=>APP.old+'#tab-'+id,
  racc:[[/tir(er|age)/i,'tirage','Tirage au sort'],[/\bATR\b|renversement|redressement/i,'figdyn','Figures dynamiques'],[/\bP\d{1,2}\b|porter/i,'porters','Répertoire des porters'],[/unisson|miroir|cascade|canon|question-réponse|accumulation|lâcher/i,'procedes','Frises des procédés'],[/focale|émotion|danger|spectaculaire/i,'leviers','Les focales'],[/échauffement autonome|fiche d’échauffement/i,'echauff','Fiche d’échauffement'],[/spectateur|grille|jumeau|jumelés/i,'passages','Fiche spectateur']],
  schemaDe:e=>{if(!e||!e.spec)return '';return schema(e.spec)},
  /* l'installation : un bloc d'information, sans fiche */
  plan(c,id){
    const s=sea(c,id);if(!s)return [];
    let fi=0;
    return s.tl.map(t=>{const typ=t[2],dur=+t[1];
      if(typ==='acc'||typ==='inst')return {k:'info',typ,label:t[0],court:'Install.',dur};
      const e=s.ex[fi],lab=e?courtD(e.t):t[0];
      return {k:'ex',typ,ref:{c,id,i:fi++},label:lab,dur}})
     .map(x=>(x.orig=x.dur,x.st='todo',x));
  },
  blocInfo(b,s,i){
    const por=s.porters.length?`<h2 class="rub">Porters du jour</h2><p class="texte">${s.porters.map(id=>{const p=porterById(id);return p?`${id} ${esc(p.nom)}`:id}).join(' · ')}</p>`:'';
    return `${s.install?`<h2 class="rub">Installation et sécurité</h2>${orgHTML(s.install)}`:''}${i===0?`<h2 class="rub">Objectif de la séance</h2><p class="texte">${esc(s.obj)}</p>${por}`:''}${s.tirage&&i===0?`<h2 class="rub">Tirage au sort</h2><p class="texte">Étape ${esc(s.tirage)} : onglet Outils › Tirage au sort.</p>`:''}${s.prepare.length&&i===0?`<h2 class="rub">Ce que la séance prépare pour l’évaluation</h2><ul class="org">${s.prepare.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}`},
  bascule:s=>s&&s.passage?`<span class="passage">${esc(PASSAGE_TXT[s.passage]||'')}</span>`:''
};
</script>
<script src="ecran.js"></script>
<script src="aide-ecran.js"></script>
<script src="eps-aide.js"></script>
</body>
</html>
